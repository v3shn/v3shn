<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>v3shn terminal header</title>
<desc>macOS styled terminal window for v3shn GitHub profile</desc>

<!-- Window shadow -->
<rect x="10" y="14" width="660" height="292" rx="12" fill="#000" opacity="0.4"/>

<!-- Window background -->
<rect x="8" y="8" width="660" height="292" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="0.8"/>

<!-- Title bar -->
<rect x="8" y="8" width="660" height="40" rx="12" fill="#313244"/>
<rect x="8" y="32" width="660" height="16" fill="#313244"/>

<!-- Traffic lights -->
<circle cx="36" cy="28" r="7" fill="#ff5f57"/>
<circle cx="60" cy="28" r="7" fill="#ffbd2e"/>
<circle cx="84" cy="28" r="7" fill="#28c840"/>

<!-- Title bar label -->
<text x="340" y="33" text-anchor="middle" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cdd6f4" opacity="0.7">v3shn — zsh — 80x24</text>

<!-- Line 1: prompt -->
<text x="32" y="76" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cba6f7">v3shn</text>
<text x="80" y="76" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#89dceb"> ~/portfolio</text>
<text x="192" y="76" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#a6e3a1"> ❯</text>
<text x="212" y="76" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cdd6f4"> cat whoami.json</text>

<!-- JSON block -->
<text x="32" y="102" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#6c7086">{</text>

<text x="52" y="120" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#89b4fa">"name"</text>
<text x="124" y="120" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cdd6f4">:  </text>
<text x="148" y="120" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#a6e3a1">"v3shn"</text>

<text x="52" y="138" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#89b4fa">"role"</text>
<text x="124" y="138" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cdd6f4">:  </text>
<text x="148" y="138" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#a6e3a1">"Frontend Developer"</text>

<text x="52" y="156" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#89b4fa">"location"</text>
<text x="152" y="156" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cdd6f4">:  </text>
<text x="176" y="156" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#a6e3a1">"Kerala, India"</text>

<text x="52" y="174" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#89b4fa">"skills"</text>
<text x="124" y="174" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cdd6f4">:  </text>
<text x="148" y="174" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#fab387">["HTML", "CSS", "JavaScript"]</text>

<text x="52" y="192" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#89b4fa">"status"</text>
<text x="124" y="192" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cdd6f4">:  </text>
<text x="148" y="192" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#a6e3a1">"open to work ✦"</text>

<text x="32" y="210" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#6c7086">}</text>

<!-- Line 2: next prompt with blinking cursor -->
<text x="32" y="238" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#cba6f7">v3shn</text>
<text x="80" y="238" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#89dceb"> ~/portfolio</text>
<text x="192" y="238" font-family="SF Mono,Fira Code,monospace" font-size="13" fill="#a6e3a1"> ❯</text>
<rect x="214" y="225" width="9" height="16" fill="#cba6f7">
  <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
</rect>

<!-- Bottom status bar -->
<path d="M8 274 h660 v14 q0 12 -12 12 h-636 q-12 0 -12 -12 z" fill="#181825"/>
<text x="28" y="291" font-family="SF Mono,Fira Code,monospace" font-size="11" fill="#6c7086"> ⎇ main</text>
<text x="116" y="291" font-family="SF Mono,Fira Code,monospace" font-size="11" fill="#45475a"> |</text>
<text x="128" y="291" font-family="SF Mono,Fira Code,monospace" font-size="11" fill="#a6e3a1"> ✓ clean</text>
<text x="460" y="291" font-family="SF Mono,Fira Code,monospace" font-size="11" fill="#6c7086">UTF-8   zsh   Kerala, India</text>
</svg>
